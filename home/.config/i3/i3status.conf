general {
    colors = true
    interval = 5
    output_format = "i3bar"
}

order += "cpu_usage"
order += "disk /"
order += "wireless _first_"
order += "ethernet _first_"
order += "battery 0"
order += "memory"
order += "tztime local"

cpu_usage {
    format = "CPU %usage"
    max_threshold = 30
}

wireless _first_ {
    format_up = "WiFi %quality %essid %ip"
    format_down = ""
}

ethernet _first_ {
    format_up = "ETH %ip"
    format_down = ""
}

battery 0 {
    format = "%status %percentage %remaining"
    format_down = ""
    status_chr = "CHR"
    status_bat = "BAT"
    status_full = "FULL"
    path = "/sys/class/power_supply/BAT%d/uevent"
    low_threshold = 10
}

memory {
    format = "RAM %used"
    threshold_degraded = "25%"
}

disk "/" {
    format = "DISK %avail"
}

tztime local {
    format = "%Y-%m-%d %H:%M"
}
