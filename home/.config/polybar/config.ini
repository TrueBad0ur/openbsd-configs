; Catppuccin Mocha
[colors]
base     = #1e1e2e
mantle   = #181825
surface0 = #313244
surface1 = #45475a
overlay0 = #6c7086
text     = #cdd6f4
lavender = #b4befe
blue     = #89b4fa
mauve    = #cba6f7
red      = #f38ba8
green    = #a6e3a1
yellow   = #f9e2af
peach    = #fab387

[bar/main]
width = 100%
height = 30
radius = 0
fixed-center = true

background = ${colors.base}
foreground = ${colors.text}

line-size = 2
line-color = ${colors.blue}

border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1

font-0 = monospace:size=9;2
font-1 = monospace:size=11;2

modules-left   = i3
modules-center = date
modules-right  = cpu memory battery tray

separator = " | "
separator-foreground = ${colors.surface1}

wm-restack = i3
override-redirect = true

scroll-up = i3wm-wsnext
scroll-down = i3wm-wsprev

[module/tray]
type = internal/tray
tray-padding = 4

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

label-mode-padding = 2
label-mode-foreground = ${colors.base}
label-mode-background = ${colors.peach}

label-focused = %index%
label-focused-foreground = ${colors.blue}
label-focused-background = ${colors.surface0}
label-focused-underline  = ${colors.blue}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.overlay0}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.lavender}
label-visible-padding = 2

label-urgent = %index%
label-urgent-foreground = ${colors.base}
label-urgent-background = ${colors.red}
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 5
date = %Y-%m-%d
time = %H:%M
format-prefix = " "
format-prefix-foreground = ${colors.blue}
label = %date%  %time%
label-foreground = ${colors.text}

[module/cpu]
type = custom/script
exec = top -b -n 1 2>/dev/null | awk '/^CPU0/{gsub("%",""); printf "CPU %.0f%%\\n", 100-$(NF-1); exit}'
interval = 3
format-prefix = " "
format-prefix-foreground = ${colors.green}
label-foreground = ${colors.text}

[module/memory]
type = custom/script
exec = vmstat 2>/dev/null | awk 'NR==3{gsub("M","",$3); printf "RAM %sMB\\n", $3}'
interval = 5
format-prefix = " "
format-prefix-foreground = ${colors.mauve}
label-foreground = ${colors.text}

[module/battery]
type = custom/script
exec = apm -l 2>/dev/null | awk '{printf "BAT %s%%\\n", $1}'
exec-if = apm -l > /dev/null 2>&1
interval = 30
format-prefix = " "
format-prefix-foreground = ${colors.yellow}
label-foreground = ${colors.text}
